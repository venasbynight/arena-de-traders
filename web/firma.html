<header class="hud">
  <div class="logo">Arena <span>de Traders</span> <em>· Firma</em></div>

<div id="aviso" hidden></div>
<div id="cena"></div>

<aside id="painel" aria-live="polite">
  <button class="fechar" id="fechar" title="Fechar (Esc)">×</button>
  <div id="painel-corpo"></div>
</aside>

<div id="dica">
  <b>Botão direito</b> ou <b>Q/E</b> gira · <b>scroll</b> aproxima · <b>WASD</b> ou <b>botão do meio</b> move · <b>clique</b> num trader abre a ficha
</div>

<script type="module" src="/web/firma.js"></script>
